[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peopleops-control"
version = "1.0.0"
description = "Auditable synthetic HR/payroll reconciliation ETL portfolio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.2,<3", "openpyxl>=3.1,<4", "httpx>=0.27,<1"]

[project.optional-dependencies]
mssql = ["pyodbc>=5,<6"]

[project.scripts]
peopleops = "peopleops.__main__:main"

[tool.setuptools.packages.find]
include = ["peopleops*"]
